<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Worklify</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-light);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-blue);
            margin-bottom: 8px;
            display: inline-block;
        }

        .brand-text {
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div class="card login-card">
        <div class="brand">
            <div class="brand-logo">Worklify</div>
            <p class="brand-text">Sign in to your workspace</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="identity">Employee ID or Email</label>
                <input type="text" id="identity" class="form-input" placeholder="e.g. ADM001 or admin@worklify.com"
                    required value="ADM001">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required
                    value="password">
            </div>

            <button type="submit" class="btn btn-primary btn-full"
                style="margin-top: 16px; height: 48px; font-size: 1rem;">
                Sign In
            </button>

            <div style="margin-top: 24px; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
                <p>Demo Credentials:</p>
                <p>Admin: ADM001 / admin@worklify.com</p>
                <p>Employee: EMP001 / emp@worklify.com</p>
            </div>
        </form>

        <!-- Sign Up Form (Hidden by default) -->
        <form id="signup-form" style="display: none;">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="signup-name" class="form-input" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="signup-email" class="form-input" placeholder="e.g. john@worklify.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="signup-password" class="form-input" placeholder="Create a password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full"
                style="margin-top: 16px; height: 48px; font-size: 1rem;">
                Create Account
            </button>
        </form>

        <div style="margin-top: 16px; text-align: center;">
            <a href="#" id="toggle-form"
                style="color: var(--accent-blue); text-decoration: none; font-size: 0.9rem;">Don't have an account?
                Create one</a>
        </div>
    </div>

    <script type="module" src="/main.js"></script>

    <script type="module">
        import { data, initData } from '/shared/data.js';

        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const toggleLink = document.getElementById('toggle-form');

        // Toggle Logic
        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                toggleLink.textContent = "Don't have an account? Create one";
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                toggleLink.textContent = "Already have an account? Sign In";
            }
        });

        // Sign Up Logic
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = signupForm.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = "Creating...";
            btn.disabled = true;

            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value.toLowerCase();
            const password = document.getElementById('signup-password').value;

            // Random ID Generation
            const employeeId = 'EMP' + Math.floor(1000 + Math.random() * 9000);

            try {
                // Register User via API
                const res = await fetch('/api/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: Date.now(),
                        employeeId,
                        name,
                        email,
                        password,
                        role: 'employee',
                        status: 'Active',
                        avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`,
                        attendanceSummary: { presentDays: 0, absentDays: 0, leaveDays: 0 }
                    })
                });

                if (!res.ok) throw new Error('Registration failed');

                alert(`Account created successfully! Your ID is: ${employeeId}`);

                // Switch to Login but don't auto-fill to ensure they remember it
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                toggleLink.textContent = "Don't have an account? Create one";

                // Pre-fill login for convenience
                document.getElementById('identity').value = email;
                document.getElementById('password').value = password;

            } catch (err) {
                console.error(err);
                alert('Error creating account. Please try again.');
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const rawIdentity = document.getElementById('identity').value.trim();
            // If it looks like an email, lowercase it. IDs might be case sensitive (e.g. ADM001).
            const identity = rawIdentity.includes('@') ? rawIdentity.toLowerCase() : rawIdentity;
            const password = document.getElementById('password').value;

            const btn = loginForm.querySelector('button');
            const originalText = btn.textContent;
            btn.textContent = "Verifying...";
            btn.disabled = true;

            try {
                // Ensure we have latest data
                await initData();

                // 1. Check Admin
                if (identity === 'admin@worklify.com' || identity === 'ADM001') {
                    localStorage.setItem('worklify_session', JSON.stringify({ role: 'admin', id: 'ADM001', name: 'Admin User' }));
                    window.location.href = '/admin/dashboard.html';
                    return;
                }

                // 2. Check Employees
                const employee = data.employees.find(e => e.employeeId === identity || e.email === identity);

                if (employee) {
                    // Password Check
                    // Default logic: if no password in DB (old records), assume '123456'
                    // actually, schema default '123456' applied to NEW records. Old records might not have it unless fetched again.
                    // Since initData fetches all, and mongoose defaults might not apply retroactively to already saved docs unless we saved them again?
                    // Actually Mongoose defaults apply when you `find`? No, only on creation usually.
                    // But good news: initData fetches raw docs. 
                    // Let's assume '123456' if undefined.

                    const dbPass = employee.password || '123456';

                    if (dbPass !== password) {
                        alert('Invalid password.');
                        btn.textContent = originalText;
                        btn.disabled = false;
                        return;
                    }

                    localStorage.setItem('worklify_session', JSON.stringify({ role: 'employee', id: employee.employeeId, name: employee.name }));
                    window.location.href = '/employee/dashboard.html';
                } else {
                    alert('Invalid credentials. Please check your Employee ID or Email.');
                    btn.textContent = originalText;
                    btn.disabled = false;
                }

            } catch (err) {
                console.error(err);
                alert('Connection error. Please try again.');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
