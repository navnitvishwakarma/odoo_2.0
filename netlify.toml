[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Removed SPA Fallback /* -> /index.html because this is a Multi-Page App.
# Netlify will serve the actual HTML files (e.g., /admin/dashboard.html) automatically.
